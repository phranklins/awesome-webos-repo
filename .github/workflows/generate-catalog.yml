name: Generate catalog

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Daily refresh so upstream releases land in the catalog.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dist/repo.json
        run: python src/generate_catalog.py -v

      - name: Commit catalog if changed
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/repo.json descriptions/
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: refresh dist/repo.json and descriptions"
            git push
          fi
