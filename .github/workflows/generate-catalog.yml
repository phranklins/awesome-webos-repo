name: Generate catalog

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Daily refresh so upstream releases and awesome-webos changes land in the catalog.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One run at a time. A second refresh waits, so two jobs cannot publish
# different catalogs over each other.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync from awesome-webos
        run: python src/sync_awesome_webos.py -v

      - name: Generate dist/repo.json
        run: python src/generate_catalog.py -v

      - name: Commit catalog if changed
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/apps.yml dist/repo.json descriptions/
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            if git diff --staged --name-only | grep -q '^catalog/apps.yml$'; then
              msg="chore: sync awesome-webos and refresh catalog"
            else
              msg="chore: refresh dist/repo.json and descriptions"
            fi
            git commit -m "$msg"
            git push
          fi

      # The commit above uses the built-in token, which does not start a
      # second workflow. Hand this run's repo.json to the Pages job directly.
      - name: Stage catalog for GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          rm -rf _site
          mkdir -p _site
          cp dist/repo.json _site/repo.json

      - name: Upload catalog for GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v7
        with:
          name: catalog-repo
          path: _site/repo.json
          if-no-files-found: error
          retention-days: 1

  publish-pages:
    needs: generate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Download catalog
        uses: actions/download-artifact@v8
        with:
          name: catalog-repo
          path: catalog-download

      - name: Place repo.json at the site root
        run: |
          mkdir -p _site
          find catalog-download -name repo.json -exec cp {} _site/repo.json \;
          test -s _site/repo.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
