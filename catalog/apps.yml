# Source list for the awesome-webos Homebrew Channel catalog.
# Only apps missing from the official Channel catalog (repo.webosbrew.org).
# Maintained by src/sync_awesome_webos.py — prefer editing via sync rules.

catalog_base_url: https://raw.githubusercontent.com/phranklins/awesome-webos-repo/main
youtube_collision_note: Same app id as webosbrew YouTube AdFree and the other YouTube homebrew forks (youtube.leanback.v4).
  Only one of these three can be installed at a time; installing another replaces or conflicts with the
  one you already have. Uninstall the official LG YouTube app before installing any of them.
apps:
- name: native-jelly
  id: com.sostk.nativejelly
  repository: https://github.com/sostk/native-jelly
  label: packaged
  source:
